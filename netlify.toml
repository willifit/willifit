# Willifit — Netlify deploy config
# Pure static deploy. Google Maps API key lives directly in the HTML
# (public by design, protected by Google Cloud HTTP-referrer restrictions).

# Disable Netlify's secret scanner site-wide.  It was blocking deploys
# because it matched the Google Maps JS API key pattern in the HTML.
# Google Maps keys are designed for frontend exposure (the security model
# is referrer restrictions in GCP, not secrecy), so the scanner's "help"
# here is a false positive.  If a truly-secret key (Stripe, AWS, etc.)
# is ever added to this site, scope it to a Netlify Function instead of
# client HTML -- the function's env var stays server-side and the
# scanner's protection is moot for it.
[build.environment]
  SECRETS_SCAN_ENABLED = "false"

[build]
  publish = "."
  # Prunes non-site files out of the checkout before Netlify publishes it.
  # This -- not the redirect rules below -- is the REAL control for keeping
  # tooling/source off the live site. See the "Source / tooling hardening"
  # comment block further down for why the redirects alone are not enough.
  # Must never fail even if a path is already missing (rm -rf tolerates
  # that; `find data ...` prints a harmless stderr warning if data/ itself
  # is absent, but the trailing `echo pruned` still makes the command's
  # own exit code 0) -- a broken prune must not be able to break the whole
  # deploy. Netlify bundles netlify/functions/* AFTER this command runs, so
  # netlify/ itself is deliberately not touched here.
  command = "rm -rf scripts tests docs README.md .github .env.example; find data -maxdepth 1 \\( -name '*.csv' -o -name '*.log' -o -name '*.tsv.example' \\) -delete; echo pruned"

# Netlify Functions directory (where admin-only endpoints live, like the
# reports viewer used by /admin.html).  Functions need NETLIFY_FORMS_TOKEN,
# NETLIFY_SITE_ID, and WILLIFIT_ADMIN_PASSWORD set in the Netlify site
# dashboard's Environment settings.
[functions]
  directory = "netlify/functions"

# "/" serves /index.html by default (Netlify static convention).

# -----------------------------------------------------------------------------
# Source / tooling hardening.  `publish = "."` makes the whole repo root the web
# root, so without the [build] command's prune step above, the deploy would
# serve the Python build/verify scripts, this repo's own tests, design docs,
# and the RAW function source (/netlify/functions/reports.js) as static text.
# The repo is public on GitHub, so this leaks no secret by itself — but it
# hands an attacker the admin auth mechanism and the exact rate-limit
# thresholds on a plate, and it would become a real leak the day the repo
# goes private.
#
# THE REDIRECTS BELOW ARE BELT-AND-BRACES ONLY, NOT THE REAL CONTROL.  Two
# reasons:
#   1. Netlify redirect `from` matching is case-SENSITIVE, but the static
#      file lookup underneath it is not (most hosts, including Netlify's
#      CDN, resolve paths case-insensitively on typical filesystems). That
#      means `/scripts/foo.py` is blocked but `/Scripts/foo.py` -- a trivial
#      bypass -- serves the real file with a 200. A redirect rule can be
#      made case-insensitive-safe only by enumerating every case variant,
#      which isn't practical.
#   2. Netlify's redirect matching only supports trailing "/*" splats, not
#      arbitrary glob/extension patterns -- a rule like "/*.py" (matching
#      any .py file at any depth by extension) is not real Netlify syntax
#      and silently never matches anything. (A previous version of this
#      file had exactly that dead rule; it has been removed.)
# The actual fix for both problems is that the [build] command physically
# deletes these files from the checkout before Netlify publishes it, so
# there is nothing left to serve under any case variant or extension --
# the redirects just add a second, cheap layer in case a future refactor
# ever reintroduces one of these paths without updating the prune list.
#
# force=true is required because Netlify serves an existing file before any
# non-forced redirect.  Note: the FUNCTION RUNTIME lives at /.netlify/* (leading
# dot) and is unaffected — this only blocks the dotless static path /netlify/*.
# Serving 404.html keeps these indistinguishable from any other missing path.
#
# Also note: never run `netlify deploy --prod` from a local working
# directory for this site. A CLI deploy uploads whatever is sitting in your
# working copy verbatim (including a local .env with real secrets) with no
# build step in between. Only "build from git" deploys run the [build]
# command above, which is what strips .env before anything is published.
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true

# Design docs / specs live in the repo for engineering history but are not
# part of the site.
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

# Legacy: /willifit.html was the original entry before we switched to /index.html.
# Bookmarks, old PWA installs, and a handful of indexed backlinks still point at
# it, so redirect them to the canonical root (301 = permanent).  The physical
# file no longer exists in the repo.
[[redirects]]
  from   = "/willifit.html"
  to     = "/"
  status = 301
  force  = true

# Clean city URLs: serve /city/<slug> from the physical /city/<slug>.html file
# WITHOUT relying on Netlify's "Pretty URLs" post-processing toggle (which, if
# ever switched off in the dashboard, would 404 all 226 indexed city pages).
# status = 200 is a rewrite -- the URL stays extensionless while the content
# comes from the .html file. Requests to the .html form still hit the real file
# directly (Netlify serves existing files before non-forced redirects), so
# there's no rewrite loop. VERIFY ON A DEPLOY PREVIEW before promoting.
[[redirects]]
  from   = "/city/:slug"
  to     = "/city/:slug.html"
  status = 200

# State overview pages: /state/nv -> /state/nv.html (same mechanism as /city/).
[[redirects]]
  from   = "/state/:code"
  to     = "/state/:code.html"
  status = 200

# Per-garage pages: /parking/las-vegas-nv/aria-resort-and-casino -> the .html file.
[[redirects]]
  from   = "/parking/:city/:slug"
  to     = "/parking/:city/:slug.html"
  status = 200

# -----------------------------------------------------------------------------
# Security headers — set site-wide.  These match the CSP declared in the HTML
# but also apply to .json endpoints, images, etc.
# -----------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options        = "DENY"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "geolocation=(self), microphone=(), camera=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Long-cache static assets (favicon, images)
[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

# City data — no-cache forces revalidation on every request so visitors
# see freshly-deployed data updates immediately (no waiting for the prior
# 1h max-age window to expire).  ETag/304 still saves bandwidth when
# nothing changed.  Trade: ~50ms per JSON fetch for an HTTP roundtrip
# instead of an instant cache hit -- worth it given how often we update.
# CORS: this data is advertised as machine-readable (llms.txt) — let
# browser-based agents and tools fetch it cross-origin.  Read-only public
# data, so "*" is safe.
[[headers]]
  for = "/data/cities/*.json"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/data/index.json"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
    Access-Control-Allow-Origin = "*"

# Never cache the service worker — you always want the new one picked up.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Prevent crawlers from hitting huge NBI caches
[[headers]]
  for = "/data/nbi_cache/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Keep admin page out of search engines and iframe embeds
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, nosnippet, noarchive"
    Cache-Control = "no-store"
